<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Link Cleaner</title><style>body{font-family:Arial;max-width:650px;margin:70px auto;padding:20px}input{width:75%;padding:14px}button{padding:14px}.result{margin-top:25px;padding:20px;background:#f0eee8}.back{color:#333}</style></head><body><a class="back" href="../../index.html">← Portfolio</a><h1>Link Cleaner</h1><p>Paste a URL to see its main domain.</p><input id="url" placeholder="https://example.com/page"><button onclick="clean()">Clean</button><div class="result" id="out">Your result will appear here.</div><script>function clean(){try{let u=new URL(url.value);out.textContent=u.hostname}catch(e){out.textContent='That does not look like a valid URL.'}}</script></body></html>
