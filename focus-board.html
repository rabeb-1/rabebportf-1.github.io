<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Board</title><style>body{font-family:Arial;max-width:700px;margin:60px auto;padding:20px;background:#f5f3ee;color:#171717}input,button{padding:12px;border:1px solid #bbb;background:white}input{width:70%}button{cursor:pointer}.filters{margin:18px 0;display:flex;gap:8px;flex-wrap:wrap}.task{display:flex;justify-content:space-between;padding:14px;background:white;border:1px solid #ddd;margin:8px 0}.done{text-decoration:line-through;opacity:.5}.back{display:inline-block;margin-bottom:30px;color:#333}</style></head><body><a class="back" href="../../index.html">← Portfolio</a><h1>Focus Board</h1><p>Add tasks, mark them done, filter them, and keep them saved in your browser.</p><input id="input" placeholder="What needs doing?"><button onclick="add()">Add</button><div class="filters"><button onclick="show('all')">All</button><button onclick="show('active')">Active</button><button onclick="show('done')">Completed</button></div><div id="list"></div><script>let tasks=JSON.parse(localStorage.tasks||'[]'),mode='all';function add(){let x=input.value.trim();if(x){tasks.push({text:x,done:false});input.value='';save()}}function save(){localStorage.tasks=JSON.stringify(tasks);render()}function show(m){mode=m;render()}function render(){list.innerHTML=tasks.filter(t=>mode==='all'||mode==='active'&&!t.done||mode==='done'&&t.done).map((t,i)=>`<div class="task ${t.done?'done':''}"><span onclick="toggle(${i})">${t.done?'✓':'○'} ${t.text}</span><button onclick="del(${i})">Delete</button></div>`).join('')}function toggle(i){tasks[i].done=!tasks[i].done;save()}function del(i){tasks.splice(i,1);save()}render()</script></body></html>
