<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Randomizer</title><style>body{font-family:Arial;display:grid;place-items:center;min-height:100vh;margin:0;background:#171717;color:white;text-align:center}.card{max-width:600px;padding:30px}button{padding:15px 25px;border:0;cursor:pointer}.back{color:#aaa}</style></head><body><div class="card"><a class="back" href="../../index.html">← Portfolio</a><h1>Daily Randomizer</h1><p>Not sure what to work on? Pick one.</p><h2 id="out">Click the button.</h2><button onclick="pick()">Choose for me</button><script>const jobs=['Build a small landing page','Practice CSS layout','Improve a README','Solve a JavaScript exercise','Read about one security concept','Clean up a project'];function pick(){out.textContent=jobs[Math.floor(Math.random()*jobs.length)]}</script></div></body></html>
