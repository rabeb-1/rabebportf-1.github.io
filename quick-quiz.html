<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Quiz</title><style>body{font-family:Arial;max-width:650px;margin:60px auto;padding:20px;background:#f4f1ea}button{display:block;width:100%;padding:14px;margin:10px 0;text-align:left;background:white;border:1px solid #ccc;cursor:pointer}.back{color:#333}</style></head><body><a class="back" href="../../index.html">← Portfolio</a><h1>Quick Quiz</h1><div id="q"></div><script>const qs=[['What does HTML mainly describe?',['Page structure','Database servers','Wi-Fi signals'],0],['Which language adds browser behavior?',['HTML','CSS','JavaScript'],2],['Which is a good security habit?',['Reuse one password','Enable 2FA','Share passwords'],1]];let i=0,score=0;function draw(){if(i===qs.length){q.innerHTML='<h2>Score: '+score+'/'+qs.length+'</h2><button onclick="location.reload()">Try again</button>';return}let x=qs[i];q.innerHTML='<h2>'+x[0]+'</h2>'+x[1].map((a,n)=>`<button onclick="answer(${n})">${a}</button>`).join('')}function answer(n){if(n===qs[i][2])score++;i++;draw()}draw()</script></body></html>
