<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cyber Checklist</title><style>body{font-family:Arial;max-width:760px;margin:60px auto;padding:20px;background:#111;color:#eee}.box{padding:18px;border:1px solid #333;margin:10px 0;background:#191919}label{display:block}.bar{height:10px;background:#333;margin:20px 0}.fill{height:100%;width:0;background:#eee}.back{color:#aaa}</style></head><body><a class="back" href="../../index.html">← Portfolio</a><h1>Cyber Checklist</h1><p>Small habits can make your accounts safer.</p><div id="items"></div><div class="bar"><div class="fill" id="fill"></div></div><p id="score">0 / 6 complete</p><script>const tips=['Use unique passwords','Turn on two-factor authentication','Update your browser','Review logged-in devices','Check account recovery options','Be careful with unexpected links'];items.innerHTML=tips.map((x,i)=>`<div class="box"><label><input type="checkbox" onchange="update()"> ${x}</label></div>`).join('');function update(){let n=document.querySelectorAll('input:checked').length;score.textContent=n+' / 6 complete';fill.style.width=(n/6*100)+'%'} </script></body></html>
