<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safe Password Lab</title><style>body{font-family:Arial;max-width:650px;margin:70px auto;padding:20px;background:#f3f1eb}input{width:100%;padding:15px;font-size:18px}.bar{height:12px;background:#ddd;margin:15px 0}.fill{height:100%;width:0;background:#222}.back{color:#333}</style></head><body><a class="back" href="../../index.html">← Portfolio</a><h1>Safe Password Lab</h1><p>Type a sample password to learn what makes one stronger. Nothing is uploaded.</p><input id="p" type="password" placeholder="Type a sample"><div class="bar"><div class="fill" id="f"></div></div><h2 id="result">Start typing</h2><p id="hint"></p><script>p.oninput=()=>{let x=p.value,n=0;if(x.length>=8)n++;if(x.length>=12)n++;if(/[A-Z]/.test(x))n++;if(/[0-9]/.test(x))n++;if(/[^A-Za-z0-9]/.test(x))n++;let words=['Very short','Needs work','Getting better','Strong','Excellent'];result.textContent=words[n];f.style.width=(n*20)+'%';hint.textContent=n<3?'Try a longer, unique passphrase with a mix of characters.':'Good learning example — use unique passwords for real accounts.'}</script></body></html>
