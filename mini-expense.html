<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Expense</title><style>body{font-family:Arial;max-width:650px;margin:60px auto;padding:20px;background:#f7f7f7}input,button{padding:12px;margin:4px}.item{padding:10px;border-bottom:1px solid #ddd}.back{color:#333}</style></head><body><a class="back" href="../../index.html">← Portfolio</a><h1>Mini Expense</h1><p>Enter an item and amount. Data stays in this page.</p><input id="name" placeholder="Item"><input id="amount" type="number" placeholder="Amount"><button onclick="add()">Add</button><div id="list"></div><h2>Total: <span id="total">0.00</span></h2><script>let data=[];function add(){let n=name.value,a=Number(amount.value);if(n&&a>0){data.push([n,a]);name.value='';amount.value='';render()}}function render(){list.innerHTML=data.map(x=>`<div class="item">${x[0]} — ${x[1].toFixed(2)}</div>`).join('');total.textContent=data.reduce((s,x)=>s+x[1],0).toFixed(2)}</script></body></html>
