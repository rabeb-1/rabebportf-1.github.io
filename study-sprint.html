<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Sprint</title><style>body{font-family:Arial;text-align:center;padding:70px 20px;background:#eee}.timer{font-size:90px;margin:25px}button{padding:12px 20px;margin:5px}.back{color:#333}</style></head><body><a class="back" href="../../index.html">← Portfolio</a><h1>Study Sprint</h1><p>25 minutes of focus. One small step at a time.</p><div class="timer" id="time">25:00</div><button onclick="start()">Start</button><button onclick="reset()">Reset</button><script>let sec=1500,id;function draw(){let m=String(Math.floor(sec/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');time.textContent=m+':'+s}function start(){clearInterval(id);id=setInterval(()=>{if(sec>0){sec--;draw()}else clearInterval(id)},1000)}function reset(){clearInterval(id);sec=1500;draw()}draw()</script></body></html>
