<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Mood</title><style>body{font-family:Arial;min-height:100vh;display:grid;place-items:center;margin:0;text-align:center;transition:.3s}.card{background:#fff;padding:35px;max-width:500px;margin:20px}button{padding:12px 18px;margin:5px;border:1px solid #222;background:white;cursor:pointer}.back{color:#333}</style></head><body><div class="card"><a class="back" href="../../index.html">← Portfolio</a><h1>Color Mood</h1><p>Pick a mood.</p><button onclick="m('calm','#dce8e2','Take it slowly.')">Calm</button><button onclick="m('focused','#e7e0d2','One thing at a time.')">Focused</button><button onclick="m('creative','#eadff0','Try something different.')">Creative</button><h2 id="out">Your mood appears here.</h2></div><script>function m(name,bg,msg){document.body.style.background=bg;out.textContent=name+' — '+msg}</script></body></html>
